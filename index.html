<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>BizTrack Nigeria — Your Business. Your Records. Your Growth.</title>
    
    <!-- PWA & Android Meta Tags -->
    <meta name="theme-color" content="#0a1128" />
    <meta name="description" content="BizTrack Nigeria - Modern Business Management for Nigerian SMEs and Retailers. Your Business. Your Records. Your Growth." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BizTrack Nigeria" />
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BizTrack" />
    
    <!-- Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .font-mono-num {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Prevent iOS bounce on fixed elements and handle notch */
      html, body {
        overscroll-behavior-y: none;
      }
      .safe-bottom {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen selection:bg-emerald-500 selection:text-white pb-safe">
    <div id="root"></div>
    
    <!-- Register Service Worker for PWA Offline & Install Support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('BizTrack Service Worker registered with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('Service Worker registration failed:', err);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
